[package]
name = "k7s-core"
version.workspace = true
description = "k7s core — transport-agnostic Kubernetes business logic"
authors.workspace = true
edition.workspace = true
rust-version.workspace = true

[lib]
name = "k7s_core"

[dependencies]
# Shared dependency umbrella — a path dep inside the workspace now.
k7s-deps.workspace = true

# Proc-macro dependencies (must be in extern prelude)
serde.workspace = true
thiserror.workspace = true
tokio.workspace = true

# Tauri support (optional)
tauri = { workspace = true, optional = true }

# MCP support (optional)
rmcp = { workspace = true, optional = true }
schemars = { workspace = true, optional = true }

[features]
default = []
tauri = ["dep:tauri"]
mcp = ["dep:rmcp", "dep:schemars"]

[dev-dependencies]
proptest.workspace = true
# properties tests create a real kube client; rustls needs an explicit crypto
# provider install when the default provider isn't already set.
rustls.workspace = true
